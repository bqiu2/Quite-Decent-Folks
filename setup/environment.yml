name: plant-game

channels:
  - conda-forge

dependencies:
  # 三个人统一使用同一个 Python 小版本
  - python=3.12.13
  - pip

  # 游戏与视觉相关包统一通过 pip 安装，
  # 避免 conda/pip 混装同一个库导致版本来源不一致。
  - pip:
      - pygame==2.6.1
      - mediapipe==0.10.35
      - opencv-contrib-python==4.11.0.86
      - numpy==1.26.4
      - Pillow==12.3.0
      - ipykernel==7.3.0
